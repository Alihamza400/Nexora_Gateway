name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ─── Lint & Format ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # ─── Type Check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  # ─── Unit Tests ────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

  # ─── Integration Tests ────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit]
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: crypto_gateway_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_gateway_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_gateway_test
          REDIS_URL: redis://localhost:6379

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: packages/*/dist/
          retention-days: 7

  # ─── Security Scan ─────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run npm audit
        run: npm audit --audit-level=high

  # ─── Docker Build (on main branch) ────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    strategy:
      matrix:
        service:
          - api-gateway
          - payment-intent
          - chain-abstraction
          - routing-engine
          - settlement
          - compliance
          - recovery
          - reconciliation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-gateway-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-gateway-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to staging
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/secrets.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/postgres.yml
          kubectl apply -f k8s/redis.yml
          kubectl apply -f k8s/network-policies.yml
          kubectl apply -f k8s/api-gateway.yml
          kubectl apply -f k8s/payment-intent.yml
          kubectl apply -f k8s/chain-abstraction.yml
          kubectl apply -f k8s/routing-engine.yml
          kubectl apply -f k8s/settlement.yml
          kubectl apply -f k8s/compliance.yml
          kubectl apply -f k8s/recovery.yml
          kubectl apply -f k8s/reconciliation.yml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/api-gateway -n crypto-gateway --timeout=300s
          kubectl rollout status deployment/payment-intent -n crypto-gateway --timeout=300s
          kubectl rollout status deployment/chain-abstraction -n crypto-gateway --timeout=300s
          kubectl rollout status deployment/routing-engine -n crypto-gateway --timeout=300s
          kubectl rollout status deployment/settlement -n crypto-gateway --timeout=300s
          kubectl rollout status deployment/compliance -n crypto-gateway --timeout=300s
          kubectl rollout status deployment/recovery -n crypto-gateway --timeout=300s
          kubectl rollout status deployment/reconciliation -n crypto-gateway --timeout=300s

  # ─── Deploy to Production ──────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy to production
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/secrets.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/postgres.yml
          kubectl apply -f k8s/redis.yml
          kubectl apply -f k8s/network-policies.yml
          kubectl apply -f k8s/api-gateway.yml
          kubectl apply -f k8s/payment-intent.yml
          kubectl apply -f k8s/chain-abstraction.yml
          kubectl apply -f k8s/routing-engine.yml
          kubectl apply -f k8s/settlement.yml
          kubectl apply -f k8s/compliance.yml
          kubectl apply -f k8s/recovery.yml
          kubectl apply -f k8s/reconciliation.yml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/api-gateway -n crypto-gateway --timeout=600s
          kubectl rollout status deployment/payment-intent -n crypto-gateway --timeout=600s
          kubectl rollout status deployment/chain-abstraction -n crypto-gateway --timeout=600s
          kubectl rollout status deployment/routing-engine -n crypto-gateway --timeout=600s
          kubectl rollout status deployment/settlement -n crypto-gateway --timeout=600s
          kubectl rollout status deployment/compliance -n crypto-gateway --timeout=600s
          kubectl rollout status deployment/recovery -n crypto-gateway --timeout=600s
          kubectl rollout status deployment/reconciliation -n crypto-gateway --timeout=600s

      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Health check
          APIGatewayIP=$(kubectl get service api-gateway-service -n crypto-gateway -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          if curl -f "http://${APIGatewayIP}/health"; then
            echo "✅ API Gateway health check passed"
          else
            echo "❌ API Gateway health check failed"
            exit 1
          fi
