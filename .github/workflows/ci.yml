name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: nothing here needs write access to repository contents.
permissions:
  contents: read

env:
  # Node 18 reached end-of-life; the supported runtime is 20 (matches docker/Dockerfile.service).
  NODE_VERSION: '20'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ─── Structural Policy Gates ───────────────────────────────────────────────
  # Rules that unit tests cannot express: no mock adapters reachable from a
  # production entrypoint, no timer-based retries, no hardcoded zero valuation,
  # no committed secrets. Cheap (seconds) and runs first so it fails fast.
  policy:
    name: Policy & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Structural policy checks
        run: bash scripts/check-policy.sh

      - name: Secret scan
        run: bash scripts/check-secrets.sh

  # ─── Lint & Format ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # ─── Type Check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  # ─── Unit Tests + Coverage Gate ────────────────────────────────────────────
  test-unit:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Thresholds are enforced by vitest.config.ts; this job fails on regression.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

  # ─── Integration Tests ────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit]

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: crypto_gateway_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_gateway_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_gateway_test
          REDIS_URL: redis://localhost:6379

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: packages/*/dist/
          retention-days: 7

  # ─── Security Scan ─────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run npm audit
        run: npm audit --audit-level=high

  # ─── Docker Build (on main branch) ────────────────────────────────────────
  # Only real, runnable processes are built. Library packages are composed inside
  # the `worker` process (docs/adr/ADR-001), so they have no image of their own.
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build, security, policy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.service
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-gateway-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-gateway-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      # Migrate before rolling out. The migrator holds a Postgres advisory lock,
      # so two concurrent deploys cannot migrate at once.
      - name: Run database migrations
        run: |
          kubectl delete job db-migrate -n crypto-gateway --ignore-not-found
          kubectl apply -f k8s/jobs/db-migrate.yml
          kubectl wait --for=condition=complete job/db-migrate -n crypto-gateway --timeout=600s

      # Apply the whole overlay so manifests cannot silently drift out of the
      # deploy list, then pin the exact revision (overlay tags are placeholders).
      - name: Deploy to staging
        run: |
          kubectl apply -k k8s/overlays/staging
          kubectl set image deployment/api-gateway api-gateway=${{ secrets.DOCKERHUB_USERNAME }}/crypto-gateway-api-gateway:${{ github.sha }} -n crypto-gateway
          kubectl set image deployment/worker worker=${{ secrets.DOCKERHUB_USERNAME }}/crypto-gateway-worker:${{ github.sha }} -n crypto-gateway

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/api-gateway -n crypto-gateway --timeout=300s
          kubectl rollout status deployment/worker -n crypto-gateway --timeout=300s

  # ─── Deploy to Production ─────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Run database migrations
        run: |
          kubectl delete job db-migrate -n crypto-gateway --ignore-not-found
          kubectl apply -f k8s/jobs/db-migrate.yml
          kubectl wait --for=condition=complete job/db-migrate -n crypto-gateway --timeout=600s

      - name: Deploy to production
        run: |
          kubectl apply -k k8s/overlays/production
          kubectl set image deployment/api-gateway api-gateway=${{ secrets.DOCKERHUB_USERNAME }}/crypto-gateway-api-gateway:${{ github.sha }} -n crypto-gateway
          kubectl set image deployment/worker worker=${{ secrets.DOCKERHUB_USERNAME }}/crypto-gateway-worker:${{ github.sha }} -n crypto-gateway

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/api-gateway -n crypto-gateway --timeout=600s
          kubectl rollout status deployment/worker -n crypto-gateway --timeout=600s

      - name: Smoke test
        run: |
          INGRESS_HOST=$(kubectl get ingress api-gateway -n crypto-gateway -o jsonpath='{.spec.rules[0].host}')
          curl -fsS --retry 5 --retry-delay 6 "https://${INGRESS_HOST}/health"
          ! curl -fsS "https://${INGRESS_HOST}/health/ready" | grep -q '"not_ready"'
