# Crypto Gateway - Production Configuration

server:
  host: 0.0.0.0
  port: 3000
  cors_origins: []  # Configure per deployment

database:
  host: ${DATABASE_HOST}
  port: 5432
  name: ${DATABASE_NAME}
  user: ${DATABASE_USER}
  password: ${DATABASE_PASSWORD}
  pool_min: 5
  pool_max: 50

redis:
  host: ${REDIS_HOST}
  port: 6379
  password: ${REDIS_PASSWORD}

# Chain RPC endpoints (mainnet)
chains:
  ethereum:
    chain_id: "1"
    rpc_url: ${ETHEREUM_RPC_URL}
    confirmation_depth: 12
    block_time: 12
  base:
    chain_id: "8453"
    rpc_url: ${BASE_RPC_URL}
    confirmation_depth: 1
    block_time: 2
  arbitrum:
    chain_id: "42161"
    rpc_url: ${ARBITRUM_RPC_URL}
    confirmation_depth: 1
    block_time: 0.25
  polygon:
    chain_id: "137"
    rpc_url: ${POLYGON_RPC_URL}
    confirmation_depth: 128
    block_time: 2
  tron:
    chain_id: "tron"
    full_node: ${TRON_FULL_NODE}
    solidity_node: ${TRON_SOLIDITY_NODE}
    confirmation_depth: 19
    block_time: 3
  solana:
    chain_id: "solana"
    rpc_url: ${SOLANA_RPC_URL}
    ws_url: ${SOLANA_WS_URL}
    confirmation_depth: 32
    block_time: 0.4

# Rate lock configuration
rate_lock:
  default_ttl_seconds: 120  # 2 minutes (tighter for production)
  max_ttl_seconds: 300
  treasury_buffer_percentage: 0.5

# Compliance thresholds
compliance:
  kyc_threshold_usd: 10000
  sanctions_check_enabled: true
  risk_scoring_provider: chainalysis

# Logging
logging:
  level: info
  format: json

# Webhooks
webhooks:
  max_retries: 5
  timeout_ms: 30000
  retry_delays_ms:
    - 1000
    - 5000
    - 30000
    - 300000
