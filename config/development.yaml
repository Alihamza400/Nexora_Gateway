# Crypto Gateway - Development Configuration

server:
  host: 0.0.0.0
  port: 3000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

database:
  host: localhost
  port: 5432
  name: crypto_gateway
  user: postgres
  password: postgres
  pool_min: 2
  pool_max: 10

redis:
  host: localhost
  port: 6379

# Chain RPC endpoints (use testnet for development)
chains:
  ethereum:
    chain_id: "11155111"  # Sepolia testnet
    rpc_url: "https://rpc.sepolia.org"
    confirmation_depth: 12
    block_time: 12
  base:
    chain_id: "84532"  # Base Sepolia
    rpc_url: "https://sepolia.base.org"
    confirmation_depth: 1
    block_time: 2

# Rate lock configuration
rate_lock:
  default_ttl_seconds: 300  # 5 minutes
  max_ttl_seconds: 600

# Compliance thresholds
compliance:
  kyc_threshold_usd: 10000
  sanctions_check_enabled: true

# Logging
logging:
  level: debug
  format: pretty

# Webhooks
webhooks:
  max_retries: 5
  timeout_ms: 30000
  retry_delays_ms:
    - 1000
    - 5000
    - 30000
    - 300000
