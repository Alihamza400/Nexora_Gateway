apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement
  namespace: crypto-gateway
  labels:
    app: settlement
    app.kubernetes.io/name: settlement
    app.kubernetes.io/part-of: crypto-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settlement
  template:
    metadata:
      labels:
        app: settlement
    spec:
      containers:
        - name: settlement
          image: crypto-gateway/settlement:latest
          ports:
            - containerPort: 3004
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: DATABASE_URL
            - name: HOT_WALLET_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: HOT_WALLET_PRIVATE_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-service
  namespace: crypto-gateway
  labels:
    app: settlement
spec:
  selector:
    app: settlement
  ports:
    - port: 80
      targetPort: 3004
      protocol: TCP
      name: http
  type: ClusterIP
