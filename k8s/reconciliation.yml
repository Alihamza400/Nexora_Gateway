apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation
  namespace: crypto-gateway
  labels:
    app: reconciliation
    app.kubernetes.io/name: reconciliation
    app.kubernetes.io/part-of: crypto-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconciliation
  template:
    metadata:
      labels:
        app: reconciliation
    spec:
      containers:
        - name: reconciliation
          image: crypto-gateway/reconciliation:latest
          ports:
            - containerPort: 3007
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reconciliation-service
  namespace: crypto-gateway
  labels:
    app: reconciliation
spec:
  selector:
    app: reconciliation
  ports:
    - port: 80
      targetPort: 3007
      protocol: TCP
      name: http
  type: ClusterIP
