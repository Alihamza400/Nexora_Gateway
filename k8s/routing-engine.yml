apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-engine
  namespace: crypto-gateway
  labels:
    app: routing-engine
    app.kubernetes.io/name: routing-engine
    app.kubernetes.io/part-of: crypto-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: routing-engine
  template:
    metadata:
      labels:
        app: routing-engine
    spec:
      containers:
        - name: routing-engine
          image: crypto-gateway/routing-engine:latest
          ports:
            - containerPort: 3003
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: NODE_ENV
            - name: QUOTE_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: QUOTE_TIMEOUT_MS
            - name: MIN_QUOTES_REQUIRED
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: MIN_QUOTES_REQUIRED
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: routing-engine-service
  namespace: crypto-gateway
  labels:
    app: routing-engine
spec:
  selector:
    app: routing-engine
  ports:
    - port: 80
      targetPort: 3003
      protocol: TCP
      name: http
  type: ClusterIP
