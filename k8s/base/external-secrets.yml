# Secrets are never committed. This replaces the previous plaintext k8s/secrets.yml.
#
# PREREQUISITE: the External Secrets Operator and its CRDs must be installed in the
# cluster, plus a ClusterSecretStore named `aws-secretsmanager` bound to an IAM role
# that can read the gateway secret path. `kubectl apply -k` fails loudly if the CRD
# is absent, which is the intended failure mode: deploying without secrets should
# not appear to succeed.
#
# The resulting Secret keeps the name `crypto-gateway-secrets` so workload manifests
# are unchanged.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crypto-gateway-secrets
  namespace: crypto-gateway
  labels:
    app.kubernetes.io/part-of: crypto-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: crypto-gateway-secrets
    creationPolicy: Owner
    # Do not leave orphaned secrets behind if this resource is deleted.
    deletionPolicy: Delete
  dataFrom:
    - extract:
        # Holds DATABASE_URL, REDIS_URL, CHAINALYSIS_API_KEY, TRM_API_KEY,
        # WEBHOOK_SECRET and the signing/routing/paymaster keys listed in
        # docs/REMAINING-IMPLEMENTATION-STRATEGY.md §13.
        key: crypto-gateway/production
