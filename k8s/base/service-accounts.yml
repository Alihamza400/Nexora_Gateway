# Dedicated service accounts per workload. No workload uses the `default` account,
# so no workload inherits cluster-default permissions.
#
# The worker carries an IAM Roles for Service Accounts (IRSA) annotation because it
# is the only component allowed to sign transactions via KMS. The IAM role behind
# `eks.amazonaws.com/role-arn` must be scoped to:
#
#   kms:Sign, kms:GetPublicKey   on the specific key ARNs only
#   secretsmanager:GetSecretValue on the gateway secret path only
#
# See docs/REMAINING-IMPLEMENTATION-STRATEGY.md §9.2 (key management policy).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: crypto-gateway
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: crypto-gateway
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: crypto-gateway
  labels:
    app: worker
    app.kubernetes.io/part-of: crypto-gateway
  annotations:
    # Overlay patches set the real role ARN. Placeholder keeps base applyable in
    # clusters that do not use IRSA (the annotation is ignored there).
    eks.amazonaws.com/role-arn: ""
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migrate
  namespace: crypto-gateway
  labels:
    app: db-migrate
    app.kubernetes.io/part-of: crypto-gateway
automountServiceAccountToken: true
