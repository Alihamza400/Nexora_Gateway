# Background worker: deposit watching, confirmation tracking, durable job
# execution (webhooks, settlement retries, screening retries).
#
# This is a singleton-style workload: the deposit watcher must not double-process,
# so replicas are held at 1 and the job queue relies on `FOR UPDATE SKIP LOCKED`
# if it is ever scaled out. See docs/adr/ADR-001 and ADR-002.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: crypto-gateway
  labels:
    app: worker
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: crypto-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: crypto-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: crypto-gateway/worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: REDIS_URL
          envFrom:
            - configMapRef:
                name: crypto-gateway-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness reflects watcher freshness: a worker that cannot see new
          # blocks is not ready to accept work.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Long grace period so an in-flight settlement can finish before exit.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      volumes:
        # readOnlyRootFilesystem: /tmp is the only writable path the runtime needs.
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: crypto-gateway
  labels:
    app: worker
    app.kubernetes.io/part-of: crypto-gateway
spec:
  selector:
    app: worker
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  type: ClusterIP
