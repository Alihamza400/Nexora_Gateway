apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance
  namespace: crypto-gateway
  labels:
    app: compliance
    app.kubernetes.io/name: compliance
    app.kubernetes.io/part-of: crypto-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compliance
  template:
    metadata:
      labels:
        app: compliance
    spec:
      containers:
        - name: compliance
          image: crypto-gateway/compliance:latest
          ports:
            - containerPort: 3005
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: NODE_ENV
            - name: CHAINALYSIS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: CHAINALYSIS_API_KEY
            - name: TRM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: TRM_API_KEY
            - name: AUTO_BLOCK_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: AUTO_BLOCK_THRESHOLD
            - name: REVIEW_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: REVIEW_THRESHOLD
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-service
  namespace: crypto-gateway
  labels:
    app: compliance
spec:
  selector:
    app: compliance
  ports:
    - port: 80
      targetPort: 3005
      protocol: TCP
      name: http
  type: ClusterIP
