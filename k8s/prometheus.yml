apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
              name: prometheus
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
            - '--web.enable-lifecycle'
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: prometheus
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Crypto Gateway'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
  crypto-gateway-dashboard.json: |
    {
      "dashboard": {
        "title": "Crypto Gateway Dashboard",
        "tags": ["crypto-gateway"],
        "timezone": "browser",
        "panels": [
          {
            "title": "Payment Intent Throughput",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(payment_intent_created_total[5m]))",
                "legendText": "Created",
                "refId": "A"
              },
              {
                "expr": "sum(rate(payment_intent_settled_total[5m]))",
                "legendText": "Settled",
                "refId": "B"
              }
            ]
          },
          {
            "title": "Settlement Success Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(settlement_completed_total[5m])) / sum(rate(settlement_total[5m])) * 100",
                "refId": "A"
              }
            ]
          },
          {
            "title": "Recovery Cases",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(recovery_cases_total[5m])) by (case_type)",
                "legendText": "{{case_type}}",
                "refId": "A"
              }
            ]
          },
          {
            "title": "Provider Uptime",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(provider_requests_total[5m])) by (provider, status)",
                "legendText": "{{provider}} - {{status}}",
                "refId": "A"
              }
            ]
          },
          {
            "title": "Gas Costs",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(gas_cost_usd_total) by (chain)",
                "legendText": "{{chain}}",
                "refId": "A"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "10s"
      }
    }
