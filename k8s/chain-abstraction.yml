apiVersion: apps/v1
kind: Deployment
metadata:
  name: chain-abstraction
  namespace: crypto-gateway
  labels:
    app: chain-abstraction
    app.kubernetes.io/name: chain-abstraction
    app.kubernetes.io/part-of: crypto-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chain-abstraction
  template:
    metadata:
      labels:
        app: chain-abstraction
    spec:
      containers:
        - name: chain-abstraction
          image: crypto-gateway/chain-abstraction:latest
          ports:
            - containerPort: 3002
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: NODE_ENV
            - name: ETHEREUM_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: ETHEREUM_RPC_URL
            - name: BASE_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: BASE_RPC_URL
            - name: ARBITRUM_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: ARBITRUM_RPC_URL
            - name: POLYGON_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: POLYGON_RPC_URL
            - name: TRON_FULL_NODE
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: TRON_FULL_NODE
            - name: SOLANA_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: SOLANA_RPC_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "600m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chain-abstraction-service
  namespace: crypto-gateway
  labels:
    app: chain-abstraction
spec:
  selector:
    app: chain-abstraction
  ports:
    - port: 80
      targetPort: 3002
      protocol: TCP
      name: http
  type: ClusterIP
