apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-intent
  namespace: crypto-gateway
  labels:
    app: payment-intent
    app.kubernetes.io/name: payment-intent
    app.kubernetes.io/part-of: crypto-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-intent
  template:
    metadata:
      labels:
        app: payment-intent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: payment-intent
          image: crypto-gateway/payment-intent:latest
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: crypto-gateway-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-gateway-secrets
                  key: REDIS_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-intent-service
  namespace: crypto-gateway
  labels:
    app: payment-intent
spec:
  selector:
    app: payment-intent
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http
  type: ClusterIP
