apiVersion: v1
kind: Secret
metadata:
  name: crypto-gateway-secrets
  namespace: crypto-gateway
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/crypto_gateway"
  
  # Redis
  REDIS_URL: "redis://redis-service:6379"
  
  # Chain RPC URLs (use testnet for staging, mainnet for production)
  ETHEREUM_RPC_URL: ""
  BASE_RPC_URL: ""
  ARBITRUM_RPC_URL: ""
  POLYGON_RPC_URL: ""
  TRON_FULL_NODE: ""
  TRON_SOLIDITY_NODE: ""
  SOLANA_RPC_URL: ""
  SOLANA_WS_URL: ""
  
  # Compliance APIs
  CHAINALYSIS_API_KEY: ""
  TRM_API_KEY: ""
  
  # Webhooks
  WEBHOOK_SECRET: ""
  
  # Hot Wallet (production would use HSM/KMS)
  HOT_WALLET_PRIVATE_KEY: ""
